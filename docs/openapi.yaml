openapi: 3.1.0
info:
  title: SecureShare API
  version: 1.0.0
  description: SecureShare Phase 1 JSON API。日時は UTC の RFC 3339 形式。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security: []
tags:
  - name: System
    description: 稼働確認
  - name: Auth
    description: 管理者認証とMFA
  - name: Files
    description: 管理者のファイル操作
  - name: Shares
    description: 管理者の共有設定
  - name: Logs
    description: アクセス履歴
  - name: Public
    description: 共有相手向け操作
paths:
  /health:
    get:
      tags: [System]
      summary: 稼働状態を取得する
      operationId: getHealth
      responses:
        '200':
          description: アプリケーション稼働中。秘密情報や依存先詳細は返さない。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: エンドポイントが利用不可
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /csrf:
    get:
      tags: [Auth]
      summary: 管理セッション用CSRFトークンを取得する
      operationId: getAdminCsrf
      responses:
        '200':
          description: 管理セッション用CSRFトークン
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/login:
    post:
      tags: [Auth]
      summary: メールアドレスとパスワードで認証する
      operationId: login
      security: [{ csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: パスワード認証成功、MFA待ち
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStateResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa/totp:
    post:
      tags: [Auth]
      summary: TOTPコードを確認する
      operationId: verifyTotp
      security: [{ csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 完全認証成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mfa/recovery:
    post:
      tags: [Auth]
      summary: 復旧コードを確認する
      operationId: verifyRecoveryCode
      security: [{ csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 8, maxLength: 32 }
      responses:
        '200':
          description: 完全認証成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStateResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: 管理セッションを終了する
      operationId: logout
      security: [{ adminSession: [], csrfToken: [] }]
      responses:
        '204': { description: ログアウト完了 }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/me:
    get:
      tags: [Auth]
      summary: 現在の管理者を取得する
      operationId: getCurrentUser
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 現在の管理者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/recovery-codes:
    post:
      tags: [Auth]
      summary: 復旧コードを再生成する
      operationId: regenerateRecoveryCodes
      security: [{ adminSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp_code]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024 }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: 新しいコードをこの応答でのみ返す
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [codes]
                    properties:
                      codes:
                        type: array
                        minItems: 10
                        maxItems: 10
                        items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /files:
    get:
      tags: [Files]
      summary: ファイルを検索・一覧取得する
      operationId: listFiles
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: q
          in: query
          schema: { type: string, maxLength: 255 }
      responses:
        '200':
          description: ファイル一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Files]
      summary: ファイルをアップロードする
      operationId: uploadFile
      security: [{ adminSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 登録済みファイル
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileResponse' }
        '413':
          description: ファイルまたは総容量上限超過
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: 未対応または内容不一致
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /files/usage:
    get:
      tags: [Files]
      summary: 保存容量の使用状況を取得する
      operationId: getStorageUsage
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: 容量使用状況
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /files/{fileId}:
    delete:
      tags: [Files]
      summary: ファイルを完全削除する
      operationId: deleteFile
      security: [{ adminSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '204': { description: 完全削除完了 }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 削除処理の整合性エラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /files/{fileId}/shares:
    get:
      tags: [Shares]
      summary: ファイルの共有設定を一覧取得する
      operationId: listFileShares
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: 生トークンを含まない共有一覧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Shares]
      summary: 新しい共有URLを発行する
      operationId: createShare
      security: [{ adminSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/FileId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShareRequest' }
      responses:
        '201':
          description: token と share_url はこの応答でのみ返す
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedShareResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /shares/{shareId}/revoke:
    post:
      tags: [Shares]
      summary: 共有を停止する
      operationId: revokeShare
      security: [{ adminSession: [], csrfToken: [] }]
      parameters:
        - $ref: '#/components/parameters/ShareId'
      responses:
        '200':
          description: 停止済み共有
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /logs:
    get:
      tags: [Logs]
      summary: アクセス履歴を検索・一覧取得する
      operationId: listAccessLogs
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: action
          in: query
          schema: { type: string, enum: [resolve, unlock, preview, download] }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: アクセス履歴
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /public/csrf:
    get:
      tags: [Public]
      summary: 匿名セッション用CSRFトークンを取得する
      operationId: getPublicCsrf
      responses:
        '200':
          description: 匿名セッション用CSRFトークン
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /public/shares/resolve:
    post:
      tags: [Public]
      summary: 共有tokenを匿名セッションへ交換する
      operationId: resolveShare
      security: [{ csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '200':
          description: tokenを匿名セッションgrantへ交換
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShareResponse' }
        '404': { $ref: '#/components/responses/PublicUnavailable' }
        '410': { $ref: '#/components/responses/PublicUnavailable' }
  /public/shares/unlock:
    post:
      tags: [Public]
      summary: 共有パスワードを確認する
      operationId: unlockShare
      security: [{ publicSession: [], csrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          description: 解除済み共有状態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShareResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /public/shares/current:
    get:
      tags: [Public]
      summary: 現在の共有メタデータを取得する
      operationId: getCurrentShare
      security: [{ publicSession: [] }]
      responses:
        '200':
          description: 現在の共有
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShareResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/PublicUnavailable' }
  /public/shares/preview:
    get:
      tags: [Public]
      summary: 共有ファイルをプレビューする
      operationId: previewSharedFile
      security: [{ publicSession: [] }]
      responses:
        '200':
          description: inline 配信。対応 MIME は image/jpeg, image/png, image/webp, application/pdf, text/plain。
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/PublicUnavailable' }
        '415':
          description: プレビュー非対応
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /public/shares/download:
    get:
      tags: [Public]
      summary: 共有ファイルをダウンロードする
      operationId: downloadSharedFile
      security: [{ publicSession: [] }]
      responses:
        '200':
          description: attachment 配信。応答開始時点でダウンロード回数を消費する。
          headers:
            Content-Disposition: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/PublicUnavailable' }
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: SECURESHARE_ADMIN
    publicSession:
      type: apiKey
      in: cookie
      name: SECURESHARE_PUBLIC
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShareId:
      name: shareId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Unauthorized:
      description: 未認証、MFA未完了、またはセッション失効
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: CSRFまたは権限エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 対象が存在しない、または所有していない
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PublicUnavailable:
      description: 共有が存在しない、期限切れ、停止、または回数上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: 試行回数制限
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationFailed:
      description: 入力値エラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status: { type: string, const: ok }
    CsrfResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token]
          properties:
            token: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 1024 }
    AuthStateResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [guest, mfa_pending, authenticated] }
    User:
      type: object
      required: [id, email, role, recovery_codes_remaining]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { type: string, enum: [admin] }
        recovery_codes_remaining: { type: integer, minimum: 0 }
    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }
    File:
      type: object
      required: [id, name, extension, mime_type, size_bytes, previewable, active_share_count, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        extension: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer }
        previewable: { type: boolean }
        active_share_count: { type: integer }
        created_at: { type: string, format: date-time }
    FileResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/File' }
    FileListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/File' }
        meta: { $ref: '#/components/schemas/Pagination' }
    UsageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [used_bytes, limit_bytes, remaining_bytes]
          properties:
            used_bytes: { type: integer }
            limit_bytes: { type: integer, const: 1073741824 }
            remaining_bytes: { type: integer }
    CreateShareRequest:
      type: object
      required: [expires_in_days, download_limit]
      properties:
        expires_in_days: { type: integer, enum: [1, 3, 7, 14, 30], default: 7 }
        download_limit:
          oneOf:
            - { type: 'null' }
            - { type: integer, enum: [1, 3, 5] }
        password: { type: [string, 'null'], minLength: 8, maxLength: 128 }
    Share:
      type: object
      required: [id, file_id, password_required, expires_at, download_limit, download_count, status, created_at]
      properties:
        id: { type: integer }
        file_id: { type: integer }
        password_required: { type: boolean }
        expires_at: { type: string, format: date-time }
        download_limit: { type: [integer, 'null'] }
        download_count: { type: integer }
        status: { type: string, enum: [active, expired, revoked, limit_reached] }
        created_at: { type: string, format: date-time }
    ShareResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Share' }
    ShareListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Share' }
    CreatedShareResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/Share'
            - type: object
              required: [token, share_url]
              properties:
                token: { type: string }
                share_url: { type: string, format: uri }
    PublicShare:
      type: object
      required: [file_name, size_bytes, mime_type, previewable, password_required, unlocked, expires_at, download_limit, download_count]
      properties:
        file_name: { type: string }
        size_bytes: { type: integer }
        mime_type: { type: string }
        previewable: { type: boolean }
        password_required: { type: boolean }
        unlocked: { type: boolean }
        expires_at: { type: string, format: date-time }
        download_limit: { type: [integer, 'null'] }
        download_count: { type: integer }
    PublicShareResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/PublicShare' }
    AccessLog:
      type: object
      required: [id, action, outcome, reason_code, ip_address, created_at]
      properties:
        id: { type: integer }
        file_name: { type: [string, 'null'] }
        action: { type: string, enum: [resolve, unlock, preview, download] }
        outcome: { type: string, enum: [success, failure] }
        reason_code: { type: string }
        ip_address: { type: string }
        created_at: { type: string, format: date-time }
    AccessLogListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/AccessLog' }
        meta: { $ref: '#/components/schemas/Pagination' }
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

